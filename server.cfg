## =============================================================
##  Los Balos RP — server.cfg
##  Beheerd traject: zie SERVER-OVERHAUL.md en CLAUDE.md
## =============================================================

## --- Netwerk ---
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48

## --- Secrets (licentiesleutel, tokens) — niet in git ---
exec secrets.cfg

## --- Server identiteit ---
sv_hostname "Shops = playerowned, Clothing = item, First person, Weapons hard to get, elite anti cheat."
sets sv_projectName "Los Balos RP, DEVELOPMENT [EN/NL]"
sets sv_projectDesc "PVP RP, MONTLY WIPE!, BLUEPRINTS, Hard to get weapons, NO GRINDING."
sets locale "en-NL"
load_server_icon myLogo.png
sets tags "english, dutch, nl, nederlands, netherlands, europe, eu, benelux, en-nl, roleplay, rp, serious-rp, semi-serious, immersive, realistic, economy, hard-economy, qbox, qbx, optimized, sync, custom-scripts, active-staff, friendly, community, beginner-friendly, no-pay-to-win, frequent-updates, police, ems, mechanic, player-owned-shops, business, jobs, civilian, legal, criminal, gangs, mc, mafia, cartels, drugs, heists, robberies, illegal, imports, custom-cars, racing, drifting, housing, player-housing, crafting, weapons, clothing, eup, casino, events, minigames, pets, streaming, twitch, discord, giveaways"

set sv_enforceGameBuild 3258

# mysql_connection_string staat in secrets.cfg (bevat het wachtwoord)

## =============================================================
##  BEVEILIGING / ANTI-CHEAT HARDENING
##  Zie SERVER-OVERHAUL.md fase 2. Regels met [TEST] kunnen
##  legitieme scripts raken — controleer na inschakelen.
## =============================================================

# OneSync infinity: vereist voor server-side autoriteit en 48 slots.
set onesync on
set onesync_population true

# Blokkeert ScriptHook / veel injectors. Geen nadelen voor RP-servers.
sv_scriptHookAllowed 0

# Blokkeert entity-overname (REQUEST_CONTROL_EVENT) voor entities ouder dan
# de settle timer. Waarde 1 is de veilige stand: stopt de meeste
# entity-hijack exploits zonder tow-/sleep-scripts te breken.
set sv_filterRequestControl 1
set sv_filterRequestControlSettleTimer 30000

# Blokkeert REQUEST_PHONE_EXPLOSION_EVENT (klassieke crash/kill exploit).
set sv_enablePhoneExplosions false

# [TEST] Blokkeert NETWORK_PLAY_SOUND_EVENT routing (sound-spam exploit).
# Als mana_audio of een ander geluidsscript hierdoor stil valt: terug naar true.
set sv_enableNetworkedSounds false

# Verbergt info.json/players.json voor scrapers en botnets.
set sv_requestParanoia 1

# LET OP — bewust NIET aangezet, dit breekt qbx/ox statebags:
#   set sv_enableNetworkedScriptEntityStates false
# qbx_core, ox_inventory en qbx_vehiclekeys gebruiken client-side statebags.
# Uitzetten breekt sleutels, deuren en inventory-sync. Niet aanzetten.

# LET OP — entity lockdown staat uit. Aanzetten ('relaxed') blokkeert
# client-side entity spawns en breekt scripts die dat nog doen.
# Pas inschakelen nadat fase 2 (vehicle-autoriteit) af is.
# set sv_entityLockdown "relaxed"

## =============================================================
##  QBOX CONFIG
## =============================================================
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/qbox"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"

setr qbx:motd "<p style='padding: 1rem; background-color: #141517; border: 1px solid #373a40; border-radius: 0.5rem; text-align: center;'><span style='color: rgb(200, 200, 40);'>Welkom bij Los Balos RP</span><br>Veel plezier en blijf in character.</p>"

## --- Chat ---
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

## --- Overige resource-config ---
setr illenium-appearance:locale "en"
setr weather_disablecd true
set npwd:framework "qbx"
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f1e542"
set loadscreen:shadowColor "#1a18077f"

## --- Voice & Ox convars ---
exec voice.cfg
exec ox.cfg

## =============================================================
##  RESOURCES — laadvolgorde is bewust. Niet husselen.
## =============================================================

# 1. Cfx basis
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# 2. Core libs (moeten vóór alles wat ze gebruikt)
ensure ox_lib
ensure oxmysql
ensure qbx_core
ensure ox_target

# 3. Ox suite + Qbox suite + assets
ensure [ox]
ensure [qbx]
ensure [voice]
ensure [assets]

# 4. Standalone resources (bevat o.a. ND_Police, ND_Ambulance, renzu_*, md-drugs)
#    LET OP: ND_Police en ND_Ambulance zitten hierin. Geen losse ensure meer
#    onderaan dit bestand — dat was een dubbele start.
ensure [standalone]

# 5. Project Sloth stack
#    Deze folder werd NOOIT gestart. Dat was de oorzaak van "ps-housing werkt
#    niet" en "geen dispatch meldingen". Expliciete volgorde:
#      ps_lib        -> vereist door ps-mdt
#      fivem-freecam -> vereist door ps-housing en ps-realtor
#      ps-housing    -> vereist door ps-realtor
ensure ps_lib
ensure fivem-freecam
ensure ps-dispatch
ensure ps-housing
ensure ps-realtor
ensure ps-mdt

# 6. Telefoon — core eerst, dan de apps.
#    Was fout: [npwd-apps] startte vóór npwd zelf.
ensure npwd
ensure qbx_npwd
ensure [npwd-apps]

