<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="injured" id="screen">
        <div class="vignette"></div>
        <div class="content">
            <h1 class="status" id="status"></h1>
            <div class="countdown" id="countdown">
                <span class="countdown-label">Respawn available in</span>
                <span class="countdown-value" id="timer"></span>
            </div>
            <p class="lines" id="lines"></p>
        </div>
    </div>
</body>
</html>
